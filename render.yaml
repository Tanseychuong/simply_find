# Render Blueprint for the SimplyFind backend.
# Render dashboard -> New -> Blueprint -> pick this repo.
# Values marked `sync: false` are asked for once when the Blueprint is created.
# The frontend service is added here once the website is built.

services:
  # Django API + admin
  - type: web
    name: simplyfind-api
    runtime: python
    rootDir: backend
    plan: free            # sleeps after 15 min idle; "starter" stays awake
    # Scheduled jobs (ingestion, privacy clean-ups) run from GitHub Actions
    # (.github/workflows/ingest.yml), since Render background workers have no free plan.
    region: frankfurt
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput &&
      python manage.py setup_groups &&
      python manage.py setup_categories &&
      (python manage.py createsuperuser --noinput || echo "superuser exists or DJANGO_SUPERUSER_* not set")
    # Then, once, from a shell or a one-off job: python manage.py setup_mfa <admin email>
    # (staff need two-step sign-in for the admin).
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: INGESTION_AUTOSTART
        value: "False"
      - key: DATABASE_URL          # Supabase -> Connect -> Session pooler URI
        sync: false
      # First admin, created on build. Remove the password from the dashboard
      # after the first successful deploy.
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_NAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # Required: the public website, e.g. https://simplyfind.example. Email
      # links and the sitemap use it, and it is always an allowed origin.
      - key: SITE_URL
        sync: false
      # Extra frontend origins (a www. alias, a preview deploy), comma-separated. Optional.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # When the API and the website are on different sites, set this to
      # "None" so the browser sends the sign-in cookies (they stay Secure and
      # HttpOnly). Leave unset when both share a domain (recommended).
      - key: AUTH_COOKIE_SAMESITE
        sync: false
      - key: AUTH_COOKIE_DOMAIN    # e.g. .simplyfind.example to share cookies with api.simplyfind.example
        sync: false
      # The website's Deploy Hook URL: suspending a company or taking down a
      # live listing then rebuilds the site so its pre-rendered page goes at once.
      - key: FRONTEND_DEPLOY_HOOK
        sync: false
      # "Sign in with Google" OAuth client ID. Unset = Google sign-in off.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Email via Brevo's HTTP API (Render's free plan blocks SMTP).
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL    # a sender verified in Brevo, e.g. SimplyFind <no-reply@simplyfind.example>
        sync: false
      # Blank = keep applications until withdrawn or the account is deleted.
      - key: APPLICATION_RETENTION_DAYS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_STORAGE_BUCKET   # public: profile pictures, company logos
        sync: false
      - key: SUPABASE_PRIVATE_BUCKET   # private, required: transcripts, CVs, certificates
        sync: false
      - key: SUPABASE_S3_REGION
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      # Every upload is virus-scanned; production refuses uploads while the
      # scanner is unreachable (VIRUS_SCAN_REQUIRED defaults to on).
      - key: CLAMAV_HOST
        fromService:
          type: pserv
          name: simplyfind-clamav
          property: host
      - key: CLAMAV_PORT
        value: "3310"

  # ClamAV virus scanner, reachable only from the API on Render's private network.
  # Needs about 2 GB of memory for its signature database (no free plan).
  - type: pserv
    name: simplyfind-clamav
    runtime: image
    image:
      url: docker.io/clamav/clamav:1.4
    plan: standard
    region: frankfurt

# Render Blueprint for SimplyFind: the API, the website and the virus scanner.
# Render dashboard -> New -> Blueprint -> pick this repo.
# Values marked `sync: false` are asked for once when the Blueprint is created.
# Step-by-step: docs/deploy.md.

services:
  # The website: React app, with the public pages pre-rendered at build time
  # (frontend/scripts/prerender.mjs) for search engines and link previews.
  - type: web
    name: simplyfind-web
    runtime: static
    # No rootDir: the build cds into frontend/, so the publish path is from the repo root.
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    buildFilter:
      paths:
        - frontend/**
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The website's own address, e.g. https://simplyfind-web.onrender.com
      # (or your domain). Same value as the API's SITE_URL.
      - key: SITE_URL
        sync: false
      # The API's public address, read at build time to pre-render pages,
      # e.g. https://simplyfind-api.onrender.com
      - key: PRERENDER_API_URL
        sync: false
      # How the browser reaches the API:
      #   empty (default): same origin. The site proxies /api to the API with
      #     the rewrite below, so it works on *.onrender.com with no domain.
      #   https://api.your-domain: direct, once the site and the API share a
      #     domain (simplyfind.org + api.simplyfind.org). Faster, real visitor IPs.
      - key: VITE_API_URL
        sync: false
      # "Sign in with Google" client ID (same as the API's GOOGLE_CLIENT_ID). Empty = hidden.
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # The camera is for scanning documents at a recruitment drive desk.
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(), geolocation=()
      # Build files have content hashes in their names: cache them for good.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    # Files that exist (the pre-rendered pages, assets) are always served as
    # they are; these rules apply only to other paths, in order.
    # Change simplyfind-api.onrender.com if your API has another address.
    routes:
      - type: rewrite
        source: /api/*
        destination: https://simplyfind-api.onrender.com/api/*
      - type: rewrite
        source: /sitemap.xml
        destination: https://simplyfind-api.onrender.com/sitemap.xml
      # Every other path is a page of the app.
      - type: rewrite
        source: /*
        destination: /app.html

  # Django API + admin
  - type: web
    name: simplyfind-api
    runtime: python
    rootDir: backend
    plan: free            # sleeps after 15 min idle; "starter" stays awake
    # Scheduled jobs (ingestion, privacy clean-ups) run from GitHub Actions
    # (.github/workflows/ingest.yml), since Render background workers have no free plan.
    region: frankfurt
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput &&
      python manage.py setup_groups &&
      python manage.py setup_categories &&
      (python manage.py createsuperuser --noinput || echo "superuser exists or DJANGO_SUPERUSER_* not set")
    # Then, once, from a shell or a one-off job: python manage.py setup_mfa <admin email>
    # (staff need two-step sign-in for the admin).
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: INGESTION_AUTOSTART
        value: "False"
      - key: DATABASE_URL          # Supabase -> Connect -> Session pooler URI
        sync: false
      # First admin, created on build. Remove the password from the dashboard
      # after the first successful deploy.
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_NAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # Required: the public website, e.g. https://simplyfind.example. Email
      # links and the sitemap use it, and it is always an allowed origin.
      - key: SITE_URL
        sync: false
      # Extra frontend origins (a www. alias, a preview deploy), comma-separated. Optional.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Leave both unset. The website reaches the API either through its /api
      # proxy (same origin) or at api.<your domain> (same site), and the
      # default SameSite=Lax host-only cookies work for both. "None" is only
      # for a website on a different site, which browsers increasingly block.
      - key: AUTH_COOKIE_SAMESITE
        sync: false
      - key: AUTH_COOKIE_DOMAIN
        sync: false
      # The website's Deploy Hook URL (simplyfind-web -> Settings -> Deploy Hook):
      # suspending a company or taking down a live listing then rebuilds the
      # site so its pre-rendered page goes at once. The same URL goes in the
      # GitHub secret RENDER_FRONTEND_DEPLOY_HOOK for the twice-daily rebuild.
      - key: FRONTEND_DEPLOY_HOOK
        sync: false
      # "Sign in with Google" OAuth client ID. Unset = Google sign-in off.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Email via Brevo's HTTP API (Render's free plan blocks SMTP).
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL    # a sender verified in Brevo, e.g. SimplyFind <no-reply@simplyfind.example>
        sync: false
      # Blank = keep applications until withdrawn or the account is deleted.
      - key: APPLICATION_RETENTION_DAYS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_STORAGE_BUCKET   # public: profile pictures, company logos
        sync: false
      - key: SUPABASE_PRIVATE_BUCKET   # private, required: transcripts, CVs, certificates
        sync: false
      - key: SUPABASE_S3_REGION
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      # Every upload is virus-scanned; production refuses uploads while the
      # scanner is unreachable (VIRUS_SCAN_REQUIRED defaults to on).
      - key: CLAMAV_HOST
        fromService:
          type: pserv
          name: simplyfind-clamav
          property: host
      - key: CLAMAV_PORT
        value: "3310"

  # ClamAV virus scanner, reachable only from the API on Render's private network.
  # Needs about 2 GB of memory for its signature database (no free plan).
  - type: pserv
    name: simplyfind-clamav
    runtime: image
    image:
      url: docker.io/clamav/clamav:1.4
    plan: standard
    region: frankfurt

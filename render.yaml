# Render Blueprint — creates the whole site from this file.
# Render dashboard → New → Blueprint → pick this repo. See docs/DEPLOY.md.
# Values marked `sync: false` are asked for once when the Blueprint is created.

services:
  # Django API + admin
  - type: web
    name: eel-api
    runtime: python
    rootDir: backend
    plan: free            # sleeps after 15 min idle; "starter" stays awake
    # Automatic ingestion runs from GitHub Actions (.github/workflows/ingest.yml),
    # since Render background workers have no free plan.
    region: frankfurt
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput &&
      python manage.py setup_groups &&
      python manage.py setup_categories &&
      (python manage.py createsuperuser --noinput || echo "superuser exists or DJANGO_SUPERUSER_* not set")
    # 4 threads per worker serve the homepage's parallel requests; the longer
    # timeout stops the admin "fetch now" action being killed mid-fetch.
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: INGESTION_AUTOSTART
        value: "False"
      - key: PREMIUM_ENABLED       # frozen until further notice
        value: "False"
      - key: DATABASE_URL          # Supabase → Connect → Session pooler URI
        sync: false
      # First admin, created on build (free plan has no shell). Remove the
      # password from the dashboard after the first successful deploy.
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_NAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # The production sites are always allowed (config/settings.py); list any
      # extra frontend origins here, comma-separated. Optional.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # eel-web's Deploy Hook URL: suspending a company or taking down a live
      # listing then rebuilds the site so its pre-rendered page goes at once.
      - key: FRONTEND_DEPLOY_HOOK
        sync: false
      # "Sign in with Google" OAuth client ID (same value as VITE_GOOGLE_CLIENT_ID
      # on eel-web). Unset = Google sign-in off. docs/DEPLOY.md section 2a.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Password reset email via Brevo's HTTP API (Render free blocks SMTP).
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL    # a sender verified in Brevo, e.g. Global Opportunities <no-reply@globalopportunities.live>
        sync: false
      - key: SITE_URL              # canonical public site, used in sitemap.xml and email links
        value: https://globalopportunities.live
      # Blank = keep applications until withdrawn / account deleted. A
      # retention period is a policy decision: see docs/DEPLOY.md section 5.
      - key: APPLICATION_RETENTION_DAYS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_STORAGE_BUCKET   # public: profile pictures, company logos
        sync: false
      - key: SUPABASE_PRIVATE_BUCKET   # private: job-application files (CVs)
        sync: false
      - key: SUPABASE_S3_REGION
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false

  # React frontend (static, free)
  - type: web
    name: eel-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite        # SEO: serve the API's live sitemap on the site's own domain
        source: /sitemap.xml
        destination: https://eel-api-xoj7.onrender.com/sitemap.xml
      # Pre-rendered pages (scripts/prerender.mjs) are real files and are served
      # first; every other route gets the neutral app shell. NOT index.html:
      # that is the pre-rendered home page, with the home page's canonical URL.
      - type: rewrite
        source: /*
        destination: /app.html
    envVars:
      - key: VITE_API_BASE_URL   # the eel-api URL + /api, e.g. https://eel-api.onrender.com/api
        sync: false
      - key: VITE_CONTACT_EMAIL
        sync: false
      - key: VITE_SITE_URL         # canonical URLs in page meta and pre-rendered pages
        value: https://globalopportunities.live
      - key: VITE_GOOGLE_CLIENT_ID # "Sign in with Google" button; same as GOOGLE_CLIENT_ID on eel-api
        sync: false
      - key: VITE_PREMIUM_ENABLED  # frozen until further notice; matches eel-api
        value: "false"
      - key: VITE_DONATE_URL       # donation page; blank = "#" placeholder link
        sync: false

# Checks every push and pull request: backend tests on a real PostgreSQL
# (the same engine as production). Never touches production: the
# database is a throwaway container and no secrets are used.

name: CI

# On every push to any branch (so a PR's branch is checked even when GitHub's
# pull_request events lag), and on demand. One run per branch at a time.
on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: simplyfind
          POSTGRES_PASSWORD: simplyfind
          POSTGRES_DB: simplyfind
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U simplyfind" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://simplyfind:simplyfind@localhost:5432/simplyfind
      DEBUG: "True"
      SECRET_KEY: ci-only-not-a-secret
      INGESTION_AUTOSTART: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Django system checks
        run: python manage.py check
      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      # No PRERENDER_API_URL here: the build must still succeed (static pages
      # only), exactly as it does on Render when the API is unreachable.
      - name: Build
        run: npm run build
      - name: The app shell and pre-rendered pages exist
        run: test -f dist/app.html && test -f dist/index.html && test -f dist/robots.txt
